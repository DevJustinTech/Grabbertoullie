name: Deploy backend to Hugging Face Space

# Pushes the backend/ directory (as its own git history) to the Hugging Face
# Space repo, which triggers a Docker rebuild of the Space.
#
# One-time setup in this GitHub repo:
#   - Secret   HF_TOKEN: a Hugging Face access token with "write" scope
#   - Variable HF_SPACE: the Space id, e.g. "yourname/yourspace"

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-hf-space.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # subtree split needs full history

      - name: Push backend/ to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "Missing HF_TOKEN secret or HF_SPACE variable" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          commit=$(git subtree split --prefix backend HEAD)
          git push --force \
            "https://${HF_SPACE%%/*}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" \
            "${commit}:refs/heads/main"
